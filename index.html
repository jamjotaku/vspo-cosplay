<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QE8MD8LCQ0"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-QE8MD8LCQ0');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f0f0f">
    <title>VSPO! COSPLAY ARCHIVE</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- 🎨 Design System --- */
        :root {
            --bg-color: #0f0f0f;
            --sidebar-bg: #0f0f0f;
            --card-bg: transparent;
            --text-color: #f1f1f1;
            --text-sub: #aaaaaa;
            --primary: #3ea6ff;
            --accent: #ff0000;
            --grad-main: linear-gradient(135deg, #3b82f6 0%, #d946ef 100%);
            --heart: #ff4757;
            --header-height: 60px;
            --chip-bg: #272727;
        }

        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: "M PLUS Rounded 1c", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0; padding: 0; 
            min-height: 100vh;
            padding-top: var(--header-height);
        }

        /* --- Header --- */
        header { 
            position: fixed; top: 0; left: 0; width: 100%; height: var(--header-height);
            background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 15px; z-index: 1000;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; padding: 5px; }
        .site-title { 
            font-size: 1.1rem; font-weight: 800; letter-spacing: 0.05em;
            color: #fff; cursor: pointer; display: flex; align-items: center; gap: 8px;
        }
        .site-logo-icon { 
            font-size: 1.3rem; 
            background: var(--grad-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent; color: var(--primary);
        }
        @media (max-width: 480px) { .site-title .title-text { font-size: 0.9rem; white-space: nowrap; } }

        .header-right { flex: 1; display: flex; justify-content: flex-end; }
        .search-box { 
            background: #121212; border: 1px solid #303030; border-radius: 20px; 
            display: flex; align-items: center; padding: 5px 15px; 
            width: 140px; transition: 0.3s;
        }
        .search-box:focus-within { width: 100%; max-width: 400px; border-color: #1c62b9; }
        .search-input { background: none; border: none; color: #fff; width: 100%; outline: none; font-size: 0.9rem; }
        .search-icon { color: var(--text-sub); margin-right: 5px; font-size: 0.9rem; }

        /* --- Sidebar --- */
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--sidebar-bg); z-index: 2000; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 5px 0 30px rgba(0,0,0,0.5); overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.05);
        }
        .sidebar.open { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-title { font-weight: bold; color: var(--text-sub); font-size: 0.9rem; }
        .close-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .menu-item {
            display: flex; align-items: center; gap: 15px; padding: 12px 15px; border-radius: 10px;
            color: var(--text-color); text-decoration: none; transition: 0.2s; cursor: pointer; font-weight: bold; font-size: 0.9rem;
        }
        .menu-item:hover { background: rgba(255, 255, 255, 0.1); }
        .menu-item i { width: 24px; text-align: center; }
        .menu-divider { height: 1px; background: rgba(255,255,255,0.1); margin: 10px 0; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(2px); z-index: 1999; opacity: 0; visibility: hidden; transition: 0.3s; }
        .overlay.open { opacity: 1; visibility: visible; }

        /* --- Top Areas --- */
        .top-area { background: var(--bg-color); padding-bottom: 10px; position: sticky; top: var(--header-height); z-index: 900; }
        
        .stories-container { display: flex; gap: 12px; overflow-x: auto; padding: 15px 15px 5px; scrollbar-width: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .stories-container::-webkit-scrollbar { display: none; }
        
        .chips-container { display: flex; gap: 8px; overflow-x: auto; padding: 10px 15px; scrollbar-width: none; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .chips-container::-webkit-scrollbar { display: none; }
        
        .story-item { width: 64px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.2s; }
        .story-item:active { transform: scale(0.95); }
        .story-ring { width: 62px; height: 62px; border-radius: 50%; padding: 2px; background: var(--grad-main); box-shadow: 0 0 10px rgba(59,130,246,0.2); position: relative; }
        .story-ring.seen { background: #374151; box-shadow: none; }
        .story-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg-color); object-fit: cover; }
        .story-name { font-size: 0.65rem; margin-top: 4px; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d1d5db; }

        .member-chip { 
            background: var(--chip-bg); color: var(--text-color); 
            padding: 6px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 500;
            cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
        }
        .member-chip:hover { background: #3f3f3f; }
        .member-chip.active { background: #f1f1f1; color: #0f0f0f; border-color: #f1f1f1; font-weight: bold; }

        .utility-deck { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px 5px; }
        .sort-group { display: flex; gap: 5px; background: transparent; padding: 4px; }
        .sort-btn { background: transparent; border: none; color: var(--text-sub); padding: 5px 10px; font-size: 0.8rem; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .sort-btn.active { color: var(--text-color); border-bottom: 2px solid var(--text-color); }
        .request-btn { background: rgba(255,255,255,0.05); color: #9ca3af; border: 1px solid rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 18px; font-size: 0.75rem; text-decoration: none; display: flex; align-items: center; gap: 5px; }

        /* --- ✨ Dashboards (Profile & Event) ✨ --- */
        .dashboard-container {
            display: none;
            padding: 20px 15px;
            margin: 0 auto 15px;
            max-width: 1800px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            animation: fadeIn 0.4s ease-out;
        }
        #profile-dashboard { background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(15,15,15,1) 100%); }
        #event-dashboard { background: linear-gradient(180deg, rgba(240,148,51,0.15) 0%, rgba(15,15,15,1) 100%); }
        
        .profile-header-main { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 15px; margin-bottom: 15px; }
        .profile-name { font-size: 1.8rem; font-weight: 800; color: #fff; margin: 0; display: flex; align-items: center; gap: 10px; }
        .profile-name i { color: var(--primary); }
        
        .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-sns { background: #1da1f2; color: #fff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-sns:hover { filter: brightness(1.2); }
        .btn-insta { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .btn-fantia { background: #e5005a; }
        .btn-booth { background: #fc4d50; }
        .btn-tiktok { background: #000000; border: 1px solid #333; }
        .btn-share-profile { background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; display: flex; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-share-profile:hover { background: #444; border-color: #fff; }
        
        .profile-stats-grid { display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; padding-bottom: 10px; margin-bottom: 5px; }
        .profile-stats-grid::-webkit-scrollbar { display: none; }
        .stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); padding: 12px 20px; border-radius: 12px; min-width: 140px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; color: #fff; margin-bottom: 2px; }
        .stat-label { font-size: 0.75rem; color: var(--text-sub); font-weight: bold; }

        .profile-details { margin-top: 15px; }
        .profile-details-title { font-size: 0.85rem; color: var(--text-sub); font-weight: bold; margin-bottom: 8px; display:flex; align-items:center; gap:5px; }
        .member-breakdown-box { display: flex; flex-wrap: wrap; gap: 6px; }
        .member-bd-chip { background: rgba(255,255,255,0.08); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; color: #e5e7eb; display: flex; align-items: center; gap: 5px; border: 1px solid rgba(255,255,255,0.05); cursor:pointer; transition:0.2s; }
        .member-bd-chip:hover { background: rgba(255,255,255,0.15); }
        .member-bd-count { background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 4px; font-size: 0.75rem; color: var(--primary); font-weight: bold; }

        /* --- 🌟 Cosplayer Directory 🌟 --- */
        #directory-view { display: none; padding: 20px 15px 40px; max-width: 1800px; margin: 0 auto; animation: fadeIn 0.4s ease-out; }
        .dir-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;}
        .dir-title { font-size: 1.5rem; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 10px; }
        .dir-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
        
        .dir-card { background: #1a1a1a; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.05); transition: 0.2s; cursor: pointer; text-decoration: none; color: inherit; }
        .dir-card:hover { transform: translateY(-4px); border-color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .dir-card-top { display: flex; align-items: center; gap: 12px; }
        .dir-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 2px solid #333; }
        .dir-name { font-size: 1.1rem; font-weight: bold; margin: 0; color: #fff; }
        .dir-stats { font-size: 0.8rem; color: var(--text-sub); margin-top: 2px; }
        .dir-sns-box { display: flex; gap: 8px; margin-top: auto; }
        .dir-sns-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.85rem; }

        /* --- 📅 Events Archive 🌟 --- */
        #events-view { display: none; padding: 20px 15px 40px; max-width: 1800px; margin: 0 auto; animation: fadeIn 0.4s ease-out; }
        .ev-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .ev-card { 
            height: 180px; border-radius: 12px; background-size: cover; background-position: center; 
            position: relative; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .ev-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.8); border-color: var(--primary); }
        .ev-card-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.2) 60%, transparent 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 20px;
        }
        .ev-name { font-size: 1.5rem; font-weight: bold; color: #fff; margin: 0 0 5px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .ev-stats { font-size: 0.9rem; color: var(--primary); font-weight: bold; }

        /* --- Main Grid --- */
        main { padding: 0 4px 40px; max-width: 1800px; margin: 0 auto; }
        .masonry-grid { column-count: 2; column-gap: 16px; padding: 0 8px; animation: fadeInGrid 0.4s ease-out; }
        @keyframes fadeInGrid { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 600px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1000px) { .masonry-grid { column-count: 4; } }
        @media (min-width: 1400px) { .masonry-grid { column-count: 5; } }
        @media (max-width: 400px) { .masonry-grid { column-count: 1; } }

        .card { break-inside: avoid; margin-bottom: 24px; background: transparent; position: relative; border-radius: 12px; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .card-img-area { width: 100%; height: auto; border-radius: 12px; overflow: hidden; cursor: pointer; position: relative; background: #202020; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card-img-area img { width: 100%; height: auto; display: block; transition: transform 0.5s ease; }
        .card-img-area:hover img { transform: scale(1.03); filter: brightness(1.1); }
        .new-badge { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); color: #fff; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }

        .card-meta { margin-top: 10px; display: flex; gap: 10px; padding: 0 4px; }
        .card-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; cursor: pointer; }
        .card-texts { display: flex; flex-direction: column; overflow: hidden; justify-content: center; }
        .card-title { color: #f1f1f1; font-size: 0.95rem; font-weight: 700; line-height: 1.3; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
        .card-subtitle { color: #aaaaaa; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .card-subtitle:hover { color: #fff; }

        .fav-btn-mini { margin-left: auto; background: none; border: none; color: #555; font-size: 1.1rem; cursor: pointer; transition: 0.2s; align-self: flex-start; }
        .fav-btn-mini:hover { color: var(--heart); transform: scale(1.2); }
        .fav-btn-mini.active { color: var(--heart); }

        /* --- Story Viewer --- */
        .story-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.3s; }
        .story-viewer.active { visibility: visible; opacity: 1; }
        .story-frame { width: 100%; height: 100%; position: relative; background: #000; overflow: hidden; }
        @media (min-width: 768px) { .story-frame { max-width: 420px; height: 90vh; border-radius: 12px; box-shadow: 0 0 50px rgba(59, 130, 246, 0.2); border: 1px solid #333; } .story-pc-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 2rem; cursor: pointer; z-index: 5010; } }
        .story-header { position: absolute; top: 10px; left: 0; width: 100%; padding: 10px 15px; z-index: 10; display: flex; flex-direction: column; gap: 8px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .story-progress-bar { display: flex; gap: 4px; width: 100%; height: 2px; }
        .story-progress-segment { flex: 1; height: 100%; background: rgba(255,255,255,0.3); border-radius: 2px; overflow: hidden; }
        .story-progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0s linear; }
        .story-meta { display: flex; align-items: center; justify-content: space-between; color: #fff; }
        .story-user-info { display: flex; align-items: center; gap: 10px; }
        .story-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #fff; }
        .story-username { font-size: 0.9rem; font-weight: bold; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .story-close { font-size: 1.5rem; color: #fff; cursor: pointer; padding: 5px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .story-content { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        .story-main-img { width: 100%; height: 100%; object-fit: contain; }
        .story-nav { position: absolute; top: 0; width: 50%; height: 100%; z-index: 5; cursor: pointer; }
        .story-nav.left { left: 0; }
        .story-nav.right { right: 0; }
        .story-viewer:active .story-progress-fill { transition: none !important; }

        /* --- Modals & Buttons --- */
        .modal, .diag-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 3000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal.open, .diag-modal.open { display: flex; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal img { max-height: 80vh; max-width: 95%; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.8); object-fit: contain; }
        .modal-close { position: absolute; top: 20px; right: 20px; font-size: 2rem; color: #fff; cursor: pointer; }
        .slide-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 50%; cursor: pointer; }
        .prev-btn { left: 15px; } .next-btn { right: 15px; }
        
        .ctrl-chip { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 5px; font-size: 0.9rem; padding: 8px 16px; }
        .ctrl-chip:hover { background: var(--primary); border-color: var(--primary); }

        .diag-container { background: #1f2937; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .diag-btn { background: #374151; color: #fff; border: 1px solid rgba(255,255,255,0.1); padding: 12px; width: 100%; margin-bottom: 10px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; font-weight: bold; }
        .diag-btn:hover { background: var(--primary); border-color: var(--primary); }
        .diag-step { display: none; } .diag-step.active { display: block; }

        #loading-sentinel { text-align: center; padding: 20px; color: var(--primary); }
        .fab { position: fixed; bottom: 30px; right: 20px; width: 50px; height: 50px; background: var(--accent); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px var(--accent); cursor: pointer; border: none; z-index: 900; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s; }
        .fab.show { opacity: 1; visibility: visible; }
        #toast { visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 30px; padding: 12px; position: fixed; z-index: 4000; left: 50%; bottom: 50px; transform: translateX(-50%); font-size: 0.9rem; opacity: 0; transition: 0.5s; }
    </style>
</head>
<body>

<div id="story-viewer" class="story-viewer" onclick="closeStory()">
    <div class="story-pc-close" onclick="closeStory()">&times;</div>
    <div class="story-frame" onclick="event.stopPropagation()">
        <div class="story-header">
            <div id="story-bars" class="story-progress-bar"></div>
            <div class="story-meta">
                <div class="story-user-info">
                    <img id="story-u-icon" class="story-avatar">
                    <span id="story-u-name" class="story-username"></span>
                </div>
                <div class="story-close" onclick="closeStory()">&times;</div>
            </div>
        </div>
        <div class="story-content">
            <img id="story-main-img" class="story-main-img">
            <div class="story-nav left" onclick="prevStorySlide()"></div>
            <div class="story-nav right" onclick="nextStorySlide()"></div>
        </div>
    </div>
</div>

<div id="overlay" class="overlay" onclick="toggleMenu()"></div>
<aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <span class="sidebar-title">MENU</span>
        <button class="close-btn" onclick="toggleMenu()">&times;</button>
    </div>
    <div onclick="resetToHome(); toggleMenu()" class="menu-item"><i class="fas fa-home"></i> ホーム</div>
    <div onclick="setMode('favorite'); toggleMenu()" class="menu-item"><i class="fas fa-heart" style="color:var(--heart);"></i> お気に入り</div>
    <div class="menu-divider"></div>
    <div onclick="openDiagnosis(); toggleMenu()" class="menu-item"><i class="fas fa-magic" style="color:var(--accent);"></i> 推しフォト診断</div>
    <div onclick="openEvents(); toggleMenu()" class="menu-item"><i class="fas fa-calendar-alt" style="color:#f09433;"></i> イベントまとめ</div>
    <div onclick="openDirectory(); toggleMenu()" class="menu-item"><i class="fas fa-users"></i> レイヤー名鑑</div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgV5MvOa8ZUcpQ9jL1HhYQOLS_y78ZoOnQI96iru-5JZVTrRc5Li4hBkN7igEyB5p73EuaaEfLC38G/pub?gid=0&single=true&output=csv";
    const PROFILE_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgV5MvOa8ZUcpQ9jL1HhYQOLS_y78ZoOnQI96iru-5JZVTrRc5Li4hBkN7igEyB5p73EuaaEfLC38G/pub?gid=1592730885&single=true&output=csv";
    
    const memberOrder = [
        "花芽すみれ", "花芽なずな", "小雀とと", "一ノ瀬うるは", "胡桃のあ", 
        "兎咲ミミ", "空澄セナ", "橘ひなの", "英リサ", "如月れん", 
        "神成きゅぴ", "八雲べに", "藍沢エマ", "紫宮るな", "猫汰つな", 
        "白波らむね", "小森めと", "夢野あかり", "夜乃くろむ", "紡木こかげ", 
        "千燈ゆうひ", "蝶屋はなび", "甘結もか"
    ];
    
    const memberIcons = { 
        "花芽すみれ": "👾💤", "花芽なずな": "🍣", "小雀とと": "🔫🐥", "一ノ瀬うるは": "🌠", 
        "胡桃のあ": "🧸♔", "橘ひなの": "🍫💘", "如月れん": "⏰", "英リサ": "💐", 
        "空澄セナ": "🗝♠︎", "兎咲ミミ": "🐰🍭", "神成きゅぴ": "🌩", "八雲べに": "💄💚", 
        "藍沢エマ": "🥞💫", "紫宮るな": "☪🐾", "猫汰つな": "🍒✨", "白波らむね": "🐻‍❄️🏖", "小森めと": "🪐", 
        "夢野あかり": "🍼", "夜乃くろむ": "💀⛓", "紡木こかげ": "📘💧", 
        "千燈ゆうひ": "🫠", "蝶屋はなび": "🦋🎆", "甘結もか": "🕹🔖" 
    };

    const vibeKeywords = { 'cute': ['maid','idol','bunny'], 'cool': ['police','hoodie'], 'school': ['school_uniform','gym_uniform'], 'sexy': ['swimsuit','china_dress'] };

    let allData = [];
    let profileData = {}; 
    let aggData = {}; 
    let eventsAgg = {}; 
    
    let filteredData = [], currentSort = 'random';
    let favorites = JSON.parse(localStorage.getItem('vspo_favs')) || [];
    let history = JSON.parse(localStorage.getItem('vspo_history')) || [];
    let displayLimit = 40;

    let storiesData = []; 
    let currentStoryMemberIndex = 0;
    let currentStorySlideIndex = 0;
    let storyTimer = null;
    let diagSelectedMember = "", diagSelectedVibe = "";
    
    let activeFilters = { member: null, cosplayer: null, event: null, text: "" };
    
    /* === Main Logic === */
    window.onload = function() {
        Papa.parse(PROFILE_CSV_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(profResults) {
                if (profResults.data) {
                    profResults.data.forEach(p => {
                        const nameKey = p.cosplayer || p['名前'];
                        if(nameKey) profileData[nameKey] = p;
                    });
                }
                
                Papa.parse(CSV_URL, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(results) {
                        if (!results.data) return;
                        const keys = Object.keys(results.data[0]);
                        const kMem = keys.find(k=>k.match(/member|名前/i)) || 'member';
                        const kImg = keys.find(k=>k.match(/image|url/i)) || 'image';
                        const kCos = keys.find(k=>k.match(/cosplayer|レイヤー/i)) || 'cosplayer';
                        const kTag = keys.find(k=>k.match(/tags|タグ/i)) || 'Tags';
                        const kLink = keys.find(k=>k.match(/link|twitter/i)) || 'link';
                        
                        const kAiTag = keys.find(k=>k.match(/AITags|ai_tags/i)) || 'AITags';
                        const kEvent = keys.find(k=>k.match(/Event|イベント/i)) || 'Event';

                        allData = results.data.filter(d => d[kMem] && d[kImg]).map((d, i) => {
                            const name = d[kCos] || "Unknown";
                            const img = d[kImg];
                            const evName = d[kEvent] ? d[kEvent].trim() : "";
                            
                            if(!aggData[name]) aggData[name] = { count: 0, latestImg: img };
                            aggData[name].count++;
                            
                            if (evName) {
                                if(!eventsAgg[evName]) eventsAgg[evName] = { count: 0, latestImg: img };
                                eventsAgg[evName].count++;
                            }

                            return {
                                _id: i, 
                                member: d[kMem],
                                image: img,
                                cosplayer: name,
                                link: d[kLink] || "",
                                event: evName, 
                                searchKey: (d[kMem] + name + (d[kTag]||"") + (d[kAiTag]||"") + evName).toLowerCase()
                            };
                        });

                        document.getElementById('loading-sentinel').style.display = 'none';
                        
                        initUI();
                        generateStories();
                        
                        addHorizontalScroll("stories-container");
                        addHorizontalScroll("chips-container");
                        addHorizontalScroll("profile-stats-grid");

                        runFilter();
                        checkUrlParams();
                    }
                });
            }
        });

        window.addEventListener('scroll', () => {
            if (document.getElementById('main-view').style.display !== 'none') {
                if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                    displayLimit += 20; render();
                }
            }
            const fab = document.getElementById('scrollTopBtn');
            if (window.scrollY > 300) { fab.classList.add('show'); } else { fab.classList.remove('show'); }
        });
    };

    function addHorizontalScroll(id) {
        const el = document.getElementById(id);
        if(el) { el.addEventListener("wheel", (e) => { e.preventDefault(); el.scrollLeft += e.deltaY; }); }
    }

    function initUI() {
        const box = document.getElementById('chips-container');
        box.innerHTML = `<span class="member-chip active" onclick="toggleFilter('member', null)">🏠 All</span>`;
        memberOrder.forEach(m => {
            box.innerHTML += `<span class="member-chip" onclick="toggleFilter('member', '${m}')">${memberIcons[m]||''} ${m}</span>`;
        });
    }

    function checkUrlParams() {
        const urlParams = new URLSearchParams(window.location.search);
        
        const targetCosplayer = urlParams.get('cosplayer');
        if (targetCosplayer) { filterByCosplayer(decodeURIComponent(targetCosplayer)); return; }
        
        const targetEvent = urlParams.get('event');
        if (targetEvent) { filterByEvent(decodeURIComponent(targetEvent)); return; }

        const targetImage = urlParams.get('img'); 
        if (targetImage) {
            const decodedUrl = decodeURIComponent(targetImage);
            const exists = allData.find(d => d.image === decodedUrl);
            if (exists) openModal(decodedUrl);
        }
    }

    function toggleMenu() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('open');
    }

    /* === 🌟 名鑑画面 (Directory) ロジック 🌟 === */
    function openDirectory() {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('events-view').style.display = 'none';
        document.getElementById('directory-view').style.display = 'block';
        window.scrollTo(0,0);
        
        const grid = document.getElementById('dir-grid');
        grid.innerHTML = '';
        const sortedNames = Object.keys(aggData).sort((a,b) => aggData[b].count - aggData[a].count);
        
        sortedNames.forEach(name => {
            const data = aggData[name];
            const p = profileData[name] || {};
            const getU = (key) => { const k = Object.keys(p).find(x=>x.toLowerCase().includes(key)); return k && p[k] ? p[k] : null; };
            
            const tw = getU('twitter') || getU('x');
            const ig = getU('insta');
            const fa = getU('fantia');
            const bo = getU('booth');

            let snsHtml = '';
            if(tw) snsHtml += `<div class="dir-sns-icon c-tw"><i class="fab fa-x-twitter"></i></div>`;
            if(ig) snsHtml += `<div class="dir-sns-icon c-ig"><i class="fab fa-instagram"></i></div>`;
            if(fa) snsHtml += `<div class="dir-sns-icon c-fa"><i class="fas fa-heart"></i></div>`;
            if(bo) snsHtml += `<div class="dir-sns-icon c-bo"><i class="fas fa-store"></i></div>`;

            grid.innerHTML += `
                <div class="dir-card" onclick="filterByCosplayer('${name}')">
                    <div class="dir-card-top">
                        <img src="${data.latestImg}" class="dir-avatar" loading="lazy">
                        <div>
                            <h2 class="dir-name">${name}</h2>
                            <div class="dir-stats">${data.count} Photos</div>
                        </div>
                    </div>
                    <div class="dir-sns-box">${snsHtml}</div>
                </div>`;
        });
    }
    
    /* === 📅 イベントまとめ画面 (Events) ロジック 📅 === */
    function openEvents() {
        document.getElementById('main-view').style.display = 'none';
        document.getElementById('directory-view').style.display = 'none';
        document.getElementById('profile-dashboard').style.display = 'none';
        document.getElementById('event-dashboard').style.display = 'none';
        document.getElementById('events-view').style.display = 'block';
        window.scrollTo(0,0);
        
        const grid = document.getElementById('ev-grid');
        grid.innerHTML = '';
        
        const sortedEvents = Object.keys(eventsAgg).sort((a,b) => eventsAgg[b].count - eventsAgg[a].count);
        
        if (sortedEvents.length === 0) {
            grid.innerHTML = '<div style="color:#aaa; padding:20px;">まだイベントデータがありません。</div>';
            return;
        }

        sortedEvents.forEach(ev => {
            const data = eventsAgg[ev];
            grid.innerHTML += `
                <div class="ev-card" onclick="filterByEvent('${ev}')" style="background-image: url('${data.latestImg}');">
                    <div class="ev-card-overlay">
                        <h2 class="ev-name">${ev}</h2>
                        <div class="ev-stats">${data.count} Photos</div>
                    </div>
                </div>`;
        });
    }
    
    function filterByEvent(eventName) {
        document.getElementById('events-view').style.display = 'none';
        document.getElementById('directory-view').style.display = 'none';
        document.getElementById('profile-dashboard').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        
        document.getElementById('top-area').style.display = 'none';

        activeFilters = { member: null, cosplayer: null, event: eventName, text: "" };
        document.getElementById('searchInput').value = "";
        currentSort = 'new';
        
        const evData = allData.filter(d => d.event === eventName);
        document.getElementById('ev-dash-name').innerText = eventName;
        document.getElementById('ev-dash-photos').innerText = evData.length;
        const uniqueCosplayers = new Set(evData.map(d => d.cosplayer)).size;
        document.getElementById('ev-dash-cosplayers').innerText = uniqueCosplayers;
        
        document.getElementById('event-dashboard').style.display = 'block';
        
        const newUrl = window.location.pathname + '?event=' + encodeURIComponent(eventName);
        window.history.pushState({path:newUrl}, '', newUrl);

        runFilter();
        window.scrollTo({top:0, behavior:'smooth'});
    }

    function resetEventFilter() {
        document.getElementById('event-dashboard').style.display = 'none';
        document.getElementById('top-area').style.display = 'block';
        activeFilters.event = null;
        window.history.replaceState({}, document.title, window.location.pathname);
        runFilter();
    }

    function resetToHome() {
        document.getElementById('directory-view').style.display = 'none';
        document.getElementById('events-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';
        document.getElementById('top-area').style.display = 'block';
        
        activeFilters = { member: null, cosplayer: null, event: null, text: "" };
        currentSort = 'random';
        document.getElementById('searchInput').value = "";
        document.getElementById('profile-dashboard').style.display = 'none';
        document.getElementById('event-dashboard').style.display = 'none';
        runFilter();
        window.scrollTo(0,0);
        
        window.history.replaceState({}, document.title, window.location.pathname);
    }

    /* === ✨ 個人ダッシュボードの構築処理 ✨ === */
    function filterByCosplayer(name) {
        document.getElementById('directory-view').style.display = 'none';
        document.getElementById('events-view').style.display = 'none';
        document.getElementById('main-view').style.display = 'block';

        document.getElementById('top-area').style.display = 'none';
        document.getElementById('event-dashboard').style.display = 'none';

        activeFilters = { member: null, cosplayer: name, event: null, text: "" };
        document.getElementById('searchInput').value = "";
        currentSort = 'new';
        
        const myData = allData.filter(d => d.cosplayer === name);
        if (myData.length > 0) {
            document.getElementById('prof-name').innerText = name;
            document.getElementById('prof-stat-photos').innerText = myData.length;
            
            const uniqueMembers = new Set(myData.map(d => d.member)).size;
            document.getElementById('prof-stat-members').innerText = uniqueMembers;
            
            const actionsBox = document.getElementById('prof-actions-box');
            actionsBox.innerHTML = `<button class="btn-share-profile" onclick="shareProfile()"><i class="fas fa-share-nodes"></i> Share Portfolio</button>`;
            
            const prof = profileData[name];
            let linksAdded = false;

            if (prof) {
                const pKeys = Object.keys(prof);
                const getUrl = (keyPart) => {
                    const k = pKeys.find(key => key.toLowerCase().includes(keyPart));
                    return k && prof[k] ? prof[k].trim() : null;
                };

                const tw = getUrl('twitter') || getUrl('x');
                const ig = getUrl('insta');
                const fa = getUrl('fantia');
                const bo = getUrl('booth');
                const tk = getUrl('tiktok');

                if (bo) actionsBox.insertAdjacentHTML('afterbegin', `<a href="${bo}" target="_blank" class="btn-sns btn-booth"><i class="fas fa-store"></i> Booth</a>`);
                if (fa) actionsBox.insertAdjacentHTML('afterbegin', `<a href="${fa}" target="_blank" class="btn-sns btn-fantia"><i class="fas fa-heart"></i> Fantia</a>`);
                if (tk) actionsBox.insertAdjacentHTML('afterbegin', `<a href="${tk}" target="_blank" class="btn-sns btn-tiktok"><i class="fab fa-tiktok"></i> TikTok</a>`);
                if (ig) actionsBox.insertAdjacentHTML('afterbegin', `<a href="${ig}" target="_blank" class="btn-sns btn-insta"><i class="fab fa-instagram"></i> Insta</a>`);
                if (tw) {
                    actionsBox.insertAdjacentHTML('afterbegin', `<a href="${tw}" target="_blank" class="btn-sns"><i class="fab fa-x-twitter"></i> Follow</a>`);
                    linksAdded = true;
                }
            }

            if (!linksAdded) {
                const validLinks = myData.map(d => d.link).filter(l => l && (l.includes('twitter.com') || l.includes('x.com')));
                if (validLinks.length > 0) {
                    let profileUrl = validLinks[0];
                    const match = validLinks[0].match(/(?:twitter\.com|x\.com)\/([a-zA-Z0-9_]+)/);
                    if (match && match[1] && match[1] !== "intent" && match[1] !== "search") {
                        profileUrl = `https://x.com/${match[1]}`;
                    }
                    actionsBox.insertAdjacentHTML('afterbegin', `<a href="${profileUrl}" target="_blank" class="btn-sns"><i class="fab fa-x-twitter"></i> Follow</a>`);
                }
            }

            const memberCounts = {};
            myData.forEach(d => { memberCounts[d.member] = (memberCounts[d.member] || 0) + 1; });
            const sortedMembers = Object.keys(memberCounts).sort((a,b) => memberCounts[b] - memberCounts[a]);
            
            const breakdownBox = document.getElementById('prof-breakdown-box');
            breakdownBox.innerHTML = '';
            sortedMembers.forEach(mem => {
                const count = memberCounts[mem];
                const icon = memberIcons[mem] || '';
                breakdownBox.innerHTML += `
                    <div class="member-bd-chip" id="prof-chip-${mem}" onclick="toggleProfileMemberFilter('${mem}')">
                        <span>${icon} ${mem}</span>
                        <span class="member-bd-count">${count}</span>
                    </div>`;
            });

            document.getElementById('profile-dashboard').style.display = 'block';
        }
        
        const newUrl = window.location.pathname + '?cosplayer=' + encodeURIComponent(name);
        window.history.pushState({path:newUrl}, '', newUrl);

        runFilter();
        window.scrollTo({top:0, behavior:'smooth'});
    }

    // ★追加：ポートフォリオ内でメンバーを絞り込む関数
    function toggleProfileMemberFilter(memberName) {
        if (activeFilters.member === memberName) {
            activeFilters.member = null; 
        } else {
            activeFilters.member = memberName; 
        }
        
        runFilter();
        
        // チップの見た目を更新
        document.querySelectorAll('.member-bd-chip').forEach(el => {
            el.style.background = 'rgba(255,255,255,0.08)';
            el.style.borderColor = 'rgba(255,255,255,0.05)';
        });
        
        if (activeFilters.member) {
            const activeChip = document.getElementById(`prof-chip-${activeFilters.member}`);
            if (activeChip) {
                activeChip.style.background = 'var(--primary)';
                activeChip.style.borderColor = 'var(--primary)';
            }
        }
    }

    function shareProfile() {
        const cosplayerName = document.getElementById('prof-name').innerText;
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?cosplayer=${encodeURIComponent(cosplayerName)}`;
        
        navigator.clipboard.writeText(shareUrl).then(() => {
            const t = document.getElementById('toast');
            t.innerText = "ポートフォリオURLをコピーしました！"; 
            t.style.visibility='visible'; t.style.opacity=1;
            setTimeout(()=>{ t.style.opacity=0; t.style.visibility='hidden';}, 2000);
        });
    }

    function runFilter() {
        filteredData = allData.filter(d => {
            const matchMember = !activeFilters.member || d.member === activeFilters.member;
            const matchCos = !activeFilters.cosplayer || d.cosplayer === activeFilters.cosplayer;
            const matchEvent = !activeFilters.event || d.event === activeFilters.event;
            const matchText = !activeFilters.text || d.searchKey.includes(activeFilters.text);
            return matchMember && matchCos && matchEvent && matchText;
        });
        updateSortButtons();
        updateChipStyles();
        render();
    }

    function toggleFilter(type, value) {
        if (activeFilters[type] === value) activeFilters[type] = null;
        else activeFilters[type] = value;
        if (type === 'member' && value) currentSort = 'new';
        runFilter();
    }
    
    function updateChipStyles() {
        document.querySelectorAll('#chips-container .member-chip').forEach(el => {
            el.classList.remove('active');
            if (activeFilters.member === null && !activeFilters.event && el.innerText.includes('All')) el.classList.add('active');
            if (activeFilters.member && el.innerText.includes(activeFilters.member)) el.classList.add('active');
        });
        
        let evChip = document.getElementById('active-event-chip');
        if (activeFilters.event) {
            if (!evChip) {
                const box = document.getElementById('chips-container');
                box.insertAdjacentHTML('afterbegin', `<span class="member-chip active" id="active-event-chip" onclick="resetEventFilter()" style="background: #f09433; color: #fff; border-color: #f09433;"><i class="fas fa-calendar-alt"></i> ${activeFilters.event} ✕</span>`);
            } else {
                evChip.innerHTML = `<i class="fas fa-calendar-alt"></i> ${activeFilters.event} ✕`;
                evChip.style.display = 'inline-flex';
            }
        } else {
            if (evChip) evChip.style.display = 'none';
        }
    }

    function filterByMember(name, el) { 
        document.getElementById('profile-dashboard').style.display = 'none';
        document.getElementById('event-dashboard').style.display = 'none';
        document.getElementById('top-area').style.display = 'block';
        
        activeFilters.cosplayer = null;
        activeFilters.event = null;
        window.history.replaceState({}, document.title, window.location.pathname);
        toggleFilter('member', name); 
    }

    function setMode(mode) {
        if(mode === 'favorite') { filteredData = allData.filter(d => favorites.includes(d.image)); render(); }
    }
    function manualSort(type) { currentSort = type; runFilter(); }
    function updateSortButtons() {
        document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
        if(document.getElementById('sort-' + currentSort)) document.getElementById('sort-' + currentSort).classList.add('active');
    }
    function applySort() {
        let data = [...filteredData];
        if (currentSort === 'new') data.sort((a,b) => b._id - a._id);
        else if (currentSort === 'old') data.sort((a,b) => a._id - b._id);
        else if (currentSort === 'random') data.sort(() => Math.random() - 0.5);
        return data;
    }
    function handleSearch() {
        activeFilters.text = document.getElementById('searchInput').value.toLowerCase();
        runFilter();
    }

    function render() {
        const app = document.getElementById('app');
        app.innerHTML = '';
        if(filteredData.length === 0) {
            app.innerHTML = '<div style="text-align:center; padding:80px; color:#666;">No Photos Found</div>';
            return;
        }
        const sortedData = applySort();
        const grid = document.createElement('div');
        grid.className = 'masonry-grid';
        sortedData.slice(0, displayLimit).forEach(item => {
            const avatarUrl = item.image; 
            const isFav = favorites.includes(item.image);
            const isNew = item._id > (allData.length - 15);
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="card-img-area" onclick="openModal('${item.image}')">
                    <img src="${item.image}" loading="lazy" alt="${item.member}">
                    ${isNew ? '<span class="new-badge">NEW</span>' : ''}
                </div>
                <div class="card-meta">
                    <img src="${avatarUrl}" class="card-avatar" onclick="filterByCosplayer('${item.cosplayer}'); event.stopPropagation()">
                    <div class="card-texts">
                        <div class="card-title" onclick="filterByCosplayer('${item.cosplayer}');">${item.cosplayer}</div>
                        <div class="card-subtitle" onclick="filterByMember('${item.member}', null)">${memberIcons[item.member] || ''} ${item.member}</div>
                    </div>
                    <button class="fav-btn-mini ${isFav?'active':''}" onclick="toggleFav('${item.image}', this)"><i class="${isFav ? 'fas' : 'far'} fa-heart"></i></button>
                </div>`;
            grid.appendChild(card);
        });
        app.appendChild(grid);
    }

    /* === Stories, Modals & Other Functions === */
    function generateStories() {
        const con = document.getElementById('stories-container');
        con.innerHTML = "";
        storiesData = [];
        memberOrder.forEach(member => {
            const memberPhotos = allData.filter(d => d.member === member);
            if (memberPhotos.length === 0) return;
            const layerGroups = {};
            memberPhotos.forEach(p => { if(!layerGroups[p.cosplayer]) layerGroups[p.cosplayer] = []; layerGroups[p.cosplayer].push(p); });
            const layers = Object.keys(layerGroups).sort(() => Math.random() - 0.5);
            let selectedImages = [];
            for(let layer of layers) {
                if(selectedImages.length >= 10) break;
                const pics = layerGroups[layer];
                selectedImages.push(pics[Math.floor(Math.random() * pics.length)]);
            }
            storiesData.push({ member: member, icon: selectedImages[0].image, images: selectedImages });
            const idx = storiesData.length - 1;
            con.innerHTML += `<div class="story-item" onclick="openStory(${idx})"><div class="story-ring"><img class="story-img" src="${selectedImages[0].image}"></div><span class="story-name">${member}</span></div>`;
        });
    }
    function openStory(idx) { currentStoryMemberIndex = idx; currentStorySlideIndex = 0; document.getElementById('story-viewer').classList.add('active'); renderStory(); }
    function closeStory() { if(storyTimer) clearTimeout(storyTimer); document.getElementById('story-viewer').classList.remove('active'); }
    function renderStory() {
        if(storyTimer) clearTimeout(storyTimer);
        const story = storiesData[currentStoryMemberIndex];
        const imgData = story.images[currentStorySlideIndex];
        document.getElementById('story-u-icon').src = story.icon;
        document.getElementById('story-u-name').innerText = story.member + " / " + imgData.cosplayer;
        document.getElementById('story-main-img').src = imgData.image;
        const bars = document.getElementById('story-bars');
        bars.innerHTML = '';
        story.images.forEach((_, i) => {
            const seg = document.createElement('div');
            seg.className = 'story-progress-segment';
            const fill = document.createElement('div');
            fill.className = 'story-progress-fill';
            if (i < currentStorySlideIndex) fill.style.width = '100%'; else if (i === currentStorySlideIndex) fill.id = 'current-fill'; else fill.style.width = '0%'; 
            seg.appendChild(fill); bars.appendChild(seg);
        });
        setTimeout(() => { const cf = document.getElementById('current-fill'); if(cf) { cf.style.transition = 'width 4s linear'; cf.style.width = '100%'; } }, 50);
        storyTimer = setTimeout(nextStorySlide, 4000);
    }
    function nextStorySlide() {
        if (currentStorySlideIndex < storiesData[currentStoryMemberIndex].images.length - 1) { currentStorySlideIndex++; renderStory(); } 
        else if (currentStoryMemberIndex < storiesData.length - 1) { currentStoryMemberIndex++; currentStorySlideIndex = 0; renderStory(); } 
        else closeStory();
    }
    function prevStorySlide() {
        if (currentStorySlideIndex > 0) { currentStorySlideIndex--; renderStory(); }
        else if (currentStoryMemberIndex > 0) { currentStoryMemberIndex--; currentStorySlideIndex = storiesData[currentStoryMemberIndex].images.length - 1; renderStory(); }
    }

    function toggleFav(url, btn) {
        if(favorites.includes(url)) favorites = favorites.filter(u=>u!==url);
        else favorites.push(url);
        localStorage.setItem('vspo_favs', JSON.stringify(favorites));
        const icon = btn.querySelector('i');
        if (favorites.includes(url)) { btn.classList.add('active'); icon.classList.remove('far'); icon.classList.add('fas'); }
        else { btn.classList.remove('active'); icon.classList.remove('fas'); icon.classList.add('far'); }
    }

    function openModal(url) {
        const modal = document.getElementById('modal');
        const img = document.getElementById('m-img');
        const link = document.getElementById('m-link');
        const item = allData.find(d => d.image === url);
        if(!item) return;
        img.src = url;
        link.href = item.link;
        modal.classList.add('open');
        history = [url, ...history.filter(h=>h!==url)].slice(0, 50);
        localStorage.setItem('vspo_history', JSON.stringify(history));
    }

    function closeModal() { document.getElementById('modal').classList.remove('open'); }
    function shareX() {
        const currentImgUrl = document.getElementById('m-img').src;
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?img=${encodeURIComponent(currentImgUrl)}`;
        window.open(`https://twitter.com/intent/tweet?text=ぶいすぽっ！コスプレアーカイブ&url=${encodeURIComponent(shareUrl)}`);
    }
    function copyLink() {
        const currentImgUrl = document.getElementById('m-img').src;
        const baseUrl = window.location.origin + window.location.pathname;
        const shareUrl = `${baseUrl}?img=${encodeURIComponent(currentImgUrl)}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
            const t = document.getElementById('toast');
            t.innerText = "シェア用URLをコピーしました！"; 
            t.style.visibility='visible'; t.style.opacity=1;
            setTimeout(()=>{ t.style.opacity=0; t.style.visibility='hidden';}, 2000);
        });
    }
    function changeImage(dir, e) {
        if(e) e.stopPropagation();
        const currentUrl = document.getElementById('m-img').src;
        const currentList = applySort(); 
        let idx = currentList.findIndex(d => d.image === currentUrl);
        if(idx === -1) idx = 0;
        idx += dir;
        if(idx < 0) idx = currentList.length - 1;
        if(idx >= currentList.length) idx = 0;
        openModal(currentList[idx].image);
    }

    function openDiagnosis() { document.getElementById('diag-modal').classList.add('open'); setDiagStep(1); const grid = document.getElementById('diag-member-grid'); grid.innerHTML = ""; memberOrder.forEach(m => { grid.innerHTML += `<button class="diag-btn" style="flex-direction:column; width:auto;" onclick="selectDiagMember('${m}')"><span style="font-size:1.5rem;">${memberIcons[m]}</span><span style="font-size:0.7rem;">${m}</span></button>`; }); }
    function closeDiagnosis() { document.getElementById('diag-modal').classList.remove('open'); }
    function setDiagStep(n) { document.querySelectorAll('.diag-step').forEach(e=>e.classList.remove('active')); document.getElementById('diag-step-'+n).classList.add('active'); }
    function selectDiagMember(m) { diagSelectedMember = m; setDiagStep(2); }
    function selectDiagVibe(v) { diagSelectedVibe = v; setDiagStep(3); }
    function runDiagnosis(mode) {
        let list = allData.filter(d => d.member === diagSelectedMember);
        if(diagSelectedVibe !== 'all') {
            const keys = vibeKeywords[diagSelectedVibe];
            const sub = list.filter(d => keys.some(k => d.tags.includes(k)));
            if(sub.length > 0) list = sub;
        }
        if(list.length===0) { alert("見つかりませんでした…"); return; }
        let pick;
        if(mode === 'new') list.sort((a,b) => b._id - a._id); else if(mode === 'old') list.sort((a,b) => a._id - b._id);
        if(mode === 'random') pick = list[Math.floor(Math.random()*list.length)]; else pick = list[0]; 
        document.getElementById('diag-res-img').src = pick.image;
        document.getElementById('diag-res-name').innerText = pick.cosplayer;
        setDiagStep('result');
    }
</script>
