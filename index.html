<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-QE8MD8LCQ0"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">

    <title>ぶいすぽっ！コスプレアーカイブ</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

    <style>
        /* --- 👾 Esports Neon Design Definitions --- */
        :root {
            --bg-color: #0b1120;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            
            /* 初期カラー（デフォルト） */
            --primary-color: #3b82f6; 
            --accent-color: #d946ef;  
            --neon-grad: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            
            --heart: #ff4757; 
            --glass-bg: rgba(15, 23, 42, 0.9);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        /* --- 基本設定 --- */
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: "M PLUS Rounded 1c", sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-color);
            margin: 0; padding: 0; 
            min-height: 100vh;
            padding-bottom: 100px;
            transition: background-color 0.5s;
        }

        /* --- ヘッダー --- */
        header { 
            background: var(--glass-bg);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 15px 10px; 
            position: sticky; top: 0; z-index: 100; 
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            transition: border-color 0.5s;
        }
        
        .header-top { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 15px; }
        .title-area h1 { 
            margin: 0; font-size: 1.3rem; font-weight: 800; 
            background: var(--neon-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 5px var(--primary-color));
            transition: filter 0.5s;
        }
        .total-count { font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
        .icon-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: #fff; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display:flex; align-items:center; justify-content:center; transition: 0.3s; }
        .icon-btn:hover { background: var(--primary-color); border-color: var(--primary-color); box-shadow: 0 0 10px var(--primary-color); }

        /* --- ストーリーズ --- */
        .stories-container { display: flex; gap: 12px; overflow-x: auto; padding: 5px 0 10px; scrollbar-width: none; }
        .stories-container::-webkit-scrollbar { display: none; }
        .story-item { width: 68px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: transform 0.2s; }
        .story-item:active { transform: scale(0.95); }
        .story-ring { width: 64px; height: 64px; border-radius: 50%; padding: 2px; background: var(--neon-grad); box-shadow: 0 0 10px var(--accent-color); transition: 0.5s; }
        .story-ring.seen { background: #334155; box-shadow: none; }
        .story-img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid var(--bg-color); object-fit: cover; }
        .story-name { font-size: 0.65rem; margin-top: 4px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #cbd5e1; }

        /* --- ツールバー & 検索 --- */
        .tools { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tools::-webkit-scrollbar { display: none; }
        input { 
            padding: 10px 15px; border-radius: 8px; border: 1px solid var(--border-color); 
            min-width: 150px; font-size: 16px; 
            background: rgba(0,0,0,0.3); color: #fff; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary-color); box-shadow: 0 0 10px var(--primary-color); }
        
        .tool-btn { 
            background: rgba(30, 41, 59, 0.8); border: 1px solid var(--border-color); 
            color: #94a3b8; padding: 8px 14px; border-radius: 8px; 
            font-size: 0.85rem; cursor: pointer; white-space: nowrap; font-weight: bold;
            transition: 0.3s;
        }
        .tool-btn.active { 
            background: var(--neon-grad); color: #fff; border: none; 
            box-shadow: 0 0 15px var(--accent-color);
        }

        /* メンバーチップ等 */
        .member-scroll-container, #unit-buttons-container, .tag-scroll-container { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0 10px; scrollbar-width: none; }
        .member-chip { 
            background: #1e293b; color: #cbd5e1; padding: 6px 12px; 
            border-radius: 8px; cursor: pointer; font-size: 1.1rem; 
            border: 1px solid var(--border-color); transition: 0.3s;
        }
        .member-chip.active { 
            background: #fff; color: var(--primary-color); border-color: #fff; 
            box-shadow: 0 0 15px var(--primary-color); 
            font-weight: bold; transform: scale(1.1);
        }

        /* --- メインコンテンツ --- */
        main { padding: 15px; max-width: 1600px; margin: 0 auto; width: 100%; min-height: 50vh; }
        .masonry-grid { column-count: 2; column-gap: 15px; animation: fadeInGrid 0.4s ease-out; }
        @keyframes fadeInGrid { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (min-width: 600px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 900px) { .masonry-grid { column-count: 4; column-gap: 20px; } }
        @media (min-width: 1400px) { .masonry-grid { column-count: 5; } }

        /* カードデザイン (Esports Style) */
        .card { 
            display: inline-block; width: 100%; margin-bottom: 15px; 
            border-radius: 12px; 
            overflow: hidden; position: relative; 
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
            cursor: pointer; 
            transition: all 0.3s ease;
        }
        
        .card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 8px 20px var(--primary-color); 
            border-color: var(--primary-color);
        }

        .card img { 
            width: 100%; height: auto; display: block; 
            object-fit: cover; opacity: 0; 
            animation: fadeInImg 0.5s ease-out forwards;
            transition: transform 0.5s;
        }
        .card:hover img { transform: scale(1.05); }
        @keyframes fadeInImg { from { opacity: 0; } to { opacity: 1; } }

        .card-overlay { 
            position: absolute; bottom: 0; left: 0; width: 100%; 
            background: linear-gradient(to top, rgba(2, 6, 23, 0.95) 0%, rgba(2, 6, 23, 0.6) 50%, transparent 100%); 
            padding: 40px 10px 10px; 
            pointer-events: none; 
        }

        .card-tag { 
            font-size: 0.65rem; 
            background: var(--neon-grad); 
            color: #fff; padding: 2px 8px; border-radius: 4px; 
            margin-right: 5px; font-weight: bold;
            box-shadow: 0 0 5px var(--primary-color);
        }
        
        .card-name { 
            font-size: 0.85rem; font-weight: bold; 
            display: block; margin-top: 5px; 
            color: #f1f5f9; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.03em;
        }
        
        .card-fav { 
            position: absolute; top: 8px; right: 8px; 
            width: 32px; height: 32px; border-radius: 50%; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(2px);
            color: rgba(255,255,255,0.7); display: flex; align-items: center; justify-content: center; 
            border: 1px solid rgba(255,255,255,0.1); 
            font-size: 1rem; cursor: pointer; z-index: 10; 
        }
        .card-fav.active { color: var(--heart); background: rgba(255,255,255,0.9); box-shadow: 0 0 10px var(--heart); }
        .card-new { 
            position: absolute; top: 8px; left: 8px; 
            background: #ef4444; color: #fff; font-size: 0.65rem; 
            font-weight: bold; padding: 3px 8px; border-radius: 4px; z-index: 5; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .pop-heart { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); color: var(--heart); font-size: 4rem; z-index: 20; filter: drop-shadow(0 0 15px var(--heart)); animation: popHeart 0.6s ease-out forwards; }
        @keyframes popHeart { 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 0; } }

        /* モーダル & おすすめ */
        .modal, .list-modal, .story-viewer, .diag-modal { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal img { max-height: 80vh; max-width: 95%; border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,0,0.8); }
        .slide-btn { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        
        .recommend-label { font-size: 0.9rem; font-weight: bold; margin: 15px 0 8px; color: #94a3b8; text-align: left; width: 95%; }
        .recommend-area { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; width: 100%; scrollbar-width: none; }
        .recommend-card { flex: 0 0 100px; height: 140px; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid #334155; position: relative; }
        .recommend-card img { width: 100%; height: 100%; object-fit: cover; }
        .modal-tags { margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; width: 95%; }
        .modal-tag-chip { background: rgba(255,255,255,0.1); color: #cbd5e1; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; border: 1px solid rgba(255,255,255,0.1); }

        /* ナビゲーション */
        nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
            z-index: 1000; display: flex; justify-content: space-around; align-items: center;
            padding: 10px 0; border-top: 1px solid var(--border-color);
        }
        .view-btn { background: none; border: none; color: #64748b; font-size: 0.65rem; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; cursor: pointer; transition: 0.3s; }
        .view-btn.active { color: #fff; text-shadow: 0 0 8px rgba(255,255,255,0.5); }
        .view-btn.active i { color: var(--accent-color); filter: drop-shadow(0 0 5px var(--accent-color)); transform: translateY(-3px); }

        @media (min-width: 768px) {
            nav { position: sticky; top: 0; margin-top: 0; background: var(--glass-bg); padding: 15px 0; gap: 20px; justify-content: center; }
            .view-btn { flex-direction: row; font-size: 0.9rem; color: #94a3b8; flex: 0 0 auto; background: rgba(255,255,255,0.05); padding: 8px 25px; border-radius: 20px; }
            .view-btn.active { background: var(--neon-grad); color: #fff; }
        }

        /* レイヤー名鑑・診断 */
        .list-container, .diag-container { background: #1e293b; color: #fff; border: 1px solid #334155; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .list-item { background: #0f172a; border: 1px solid #334155; color: #cbd5e1; }
        .list-item:hover { background: var(--neon-grad); color: #fff; border-color: transparent; }
        .diag-btn { background: #334155; color: #e2e8f0; border: 1px solid #475569; }
        .diag-btn:hover { border-color: var(--accent-color); box-shadow: 0 0 10px var(--accent-color); color: #fff; }
        
        .fab { background: var(--accent-color); box-shadow: 0 0 15px var(--accent-color); }
        footer { border-top: 1px solid var(--border-color); color: #64748b; }
        #loading-sentinel { color: var(--primary-color); }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="title-area">
            <h1>👘 VSPO! Cosplay Archive</h1>
            <span id="total-count" class="total-count">Loading...</span>
        </div>
        <div class="header-controls">
            <a id="contact-link" href="#" target="_blank" class="icon-btn"><i class="far fa-envelope"></i></a>
        </div>
    </div>

    <div class="stories-container" id="stories-container"></div>

  <div class="tools">
    <input type="text" id="searchInput" placeholder="検索 (例: うるは)" oninput="handleSearch()">
    <button class="tool-btn" onclick="openDiagnosis()" style="background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%); color:#c74b6a; font-weight:bold;"><i class="fas fa-magic"></i> 推しフォト診断</button>
    
    <button class="tool-btn active" id="btn-new" onclick="setSort('new')">新着順</button>
    <button class="tool-btn" id="btn-orig" onclick="setSort('original')">登録順</button>
    <button class="tool-btn" id="btn-shuf" onclick="setSort('shuffle')">シャッフル</button>
    <button class="tool-btn" onclick="openCosplayerList()" style="background: #334155; color:#fff; border:none;">レイヤー一覧</button>
    <button class="tool-btn" onclick="location.href='photographers.html'" style="background:#334155; color:#fff;">📷 カメラマン</button>
    <button class="tool-btn" onclick="location.href='group.html'" style="background:#f59e0b; color:#fff;">🎪 大型併せ</button>
    </div>

<div id="unit-buttons-container"></div>
<div class="member-scroll-container" id="memberBar"></div>
</header>

<nav>
    <button onclick="setMode('member')" class="view-btn active" id="nav-member"><i class="fas fa-home"></i> メンバー別</button>
    <button onclick="setMode('cosplayer')" class="view-btn" id="nav-cosplayer"><i class="fas fa-users"></i> レイヤー別</button>
    <button onclick="setMode('favorite')" class="view-btn" id="nav-favorite"><i class="fas fa-heart"></i> お気に入り</button>
    <button onclick="setMode('history')" class="view-btn" id="nav-history"><i class="fas fa-clock"></i> 履歴</button>
</nav>

<main id="app"></main>
<div id="loading-sentinel">読み込み中...</div>

<footer>
    <p>本サイトは非公式ファンサイトです.<br>画像の肖像権は各権利所有者に帰属します.</p>
    <p style="margin-top:10px;"><a id="remove-link" href="#" target="_blank" class="footer-link">掲載削除依頼はこちら</a></p>
</footer>

<button class="fab" id="scrollTopBtn" onclick="window.scrollTo({top:0, behavior:'smooth'})"><i class="fas fa-arrow-up"></i></button>
<div id="toast" style="visibility: hidden; min-width: 250px; background-color: #333; color: #fff; text-align: center; border-radius: 30px; padding: 12px; position: fixed; z-index: 3000; left: 50%; bottom: 100px; transform: translateX(-50%); font-size: 0.9rem; opacity: 0; transition: 0.5s;">メッセージ</div>

<div id="diag-modal" class="diag-modal">
    <div class="diag-container">
        <span class="modal-close" onclick="closeDiagnosis()" style="color:var(--text); top:10px; right:15px; font-size:1.5rem;">&times;</span>
        
        <div id="diag-step-1" class="diag-step active">
            <div class="diag-progress"><div class="diag-dot active"></div><div class="diag-dot"></div><div class="diag-dot"></div></div>
            <div class="diag-title">誰のコスプレが見たい？</div>
            <div id="diag-member-grid" class="diag-grid" style="overflow-y:auto; max-height:400px;"></div>
        </div>

        <div id="diag-step-2" class="diag-step">
            <div class="diag-progress"><div class="diag-dot"></div><div class="diag-dot active"></div><div class="diag-dot"></div></div>
            <div class="diag-title">どんな衣装の気分？</div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="diag-btn" onclick="selectDiagVibe('cute')"><i class="fas fa-heart"></i> 王道・アイドル・メイド系</button>
                <button class="diag-btn" onclick="selectDiagVibe('cool')"><i class="fas fa-bolt"></i> クール・ストリート・パーカー系</button>
                <button class="diag-btn" onclick="selectDiagVibe('school')"><i class="fas fa-graduation-cap"></i> 日常・制服・ジャージ系</button>
                <button class="diag-btn" onclick="selectDiagVibe('sexy')"><i class="fas fa-glass-cheers"></i> 大人・チャイナ・ドレス系</button>
                <button class="diag-btn" onclick="selectDiagVibe('all')"><i class="fas fa-random"></i> なんでもいい！</button>
            </div>
            <button class="profile-back" onclick="setDiagStep(1)">戻る</button>
        </div>

        <div id="diag-step-3" class="diag-step">
            <div class="diag-progress"><div class="diag-dot"></div><div class="diag-dot"></div><div class="diag-dot active"></div></div>
            <div class="diag-title">今の気分は？</div>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button class="diag-btn" onclick="runDiagnosis('new')"><i class="fas fa-sun"></i> 最新のトレンドを知りたい</button>
                <button class="diag-btn" onclick="runDiagnosis('random')"><i class="fas fa-moon"></i> 掘り出し物に出会いたい</button>
                <button class="diag-btn" onclick="runDiagnosis('old')"><i class="fas fa-history"></i> 昔の投稿を振り返りたい</button>
            </div>
            <button class="profile-back" onclick="setDiagStep(2)">戻る</button>
        </div>

        <div id="diag-result" class="diag-step">
            <div class="diag-title" style="color:#ff4757;">💘 運命の1枚が見つかりました！</div>
            <img id="diag-res-img" class="diag-result-img" onclick="">
            <div id="diag-res-name" style="font-weight:bold; margin-bottom:10px;"></div>
            <button class="tool-btn active" onclick="openModal(document.getElementById('diag-res-img').src); closeDiagnosis();" style="width:100%; padding:15px; margin-bottom:10px;">大きく見る</button>
            <button class="profile-back" onclick="setDiagStep(1)">もう一度診断する</button>
        </div>
    </div>
</div>

<div id="modal" class="modal" onclick="closeModal()">
    <span class="modal-close">&times;</span>
    <button class="slide-btn prev-btn" onclick="changeImage(-1, event)"><i class="fas fa-chevron-left"></i></button>
    <button class="slide-btn next-btn" onclick="changeImage(1, event)"><i class="fas fa-chevron-right"></i></button>
    
    <div style="display:flex; flex-direction:column; align-items:center; width:100%;">
        <img id="m-img" onclick="event.stopPropagation()">
        <div id="rec-label" class="recommend-label" style="display:none;">✨ こちらもおすすめ</div>
        <div id="m-recommend" class="recommend-area" onclick="event.stopPropagation()"></div>
        <div id="m-tags" class="modal-tags" onclick="event.stopPropagation()"></div>
    </div>

    <div class="share-area" onclick="event.stopPropagation()">
        <a id="btn-profile" href="#" target="_blank" class="share-btn btn-profile" style="display:none;"><i class="fas fa-user"></i> プロフ</a>
        <button class="share-btn btn-copy" onclick="copyLink()"><i class="fas fa-link"></i> リンク</button>
        <button class="share-btn btn-x" onclick="shareX()"><i class="fab fa-x-twitter"></i> ポスト</button>
        <a id="m-link" href="#" target="_blank" class="share-btn btn-link"><i class="fas fa-external-link-alt"></i> 元投稿</a>
    </div>
</div>

<div id="list-modal" class="list-modal" onclick="closeCosplayerList()">
    <div class="list-container" onclick="event.stopPropagation()">
        <span class="modal-close" onclick="closeCosplayerList()" style="color:var(--text); top:10px; right:15px;">&times;</span>
        <div class="list-header">📔 レイヤー名鑑 (50音順)</div>
        <ul id="cosplayer-list" class="list-ul"></ul>
    </div>
</div>

<div id="story-viewer" class="story-viewer" onclick="closeStory()">
    <div class="story-content" onclick="event.stopPropagation()">
        <div class="story-bars" id="story-bars"></div>
        <div class="story-meta"><img id="story-icon"> <span id="story-user" style="font-weight:bold;"></span></div>
        <img id="story-main" class="story-img-main">
        <div class="story-nav nav-left" onclick="prevStory()"></div>
        <div class="story-nav nav-right" onclick="nextStory()"></div>
    </div>
</div>

<script>

    function smartShuffle(data) {
        const groups = {};
        data.forEach(item => {
            const key = item.cosplayer || item.member || "unknown";
            if (!groups[key]) groups[key] = [];
            groups[key].push(item);
        });
        Object.keys(groups).forEach(key => { groups[key].sort(() => Math.random() - 0.5); });
        const result = [];
        let keys = Object.keys(groups); 
        while (keys.length > 0) {
            keys.sort(() => Math.random() - 0.5);
            const nextKeys = [];
            keys.forEach(key => {
                if (groups[key].length > 0) {
                    result.push(groups[key].pop());
                    if (groups[key].length > 0) nextKeys.push(key);
                }
            });
            keys = nextKeys;
        }
        return result;
    }

    function applySort() {
        if(currentSort==='new') filteredData.sort((a,b)=>b._originalIndex - a._originalIndex);
        if(currentSort==='original') filteredData.sort((a,b)=>a._originalIndex - b._originalIndex);
        if(currentSort==='shuffle') filteredData = smartShuffle([...filteredData]);
        render();
    }

    // ストーリー機能 (全画面)
    function generateStories() {
        const c = document.getElementById('stories-container');
        c.innerHTML = "";
        storiesData = [];
        const seed = new Date().getDate(); 
        function seededRandom(s) { var x = Math.sin(s++) * 10000; return x - Math.floor(x); }

        Object.keys(memberIcons).forEach(m => {
            const items = allData.filter(d => d.member === m);
            if(items.length > 0) {
                const temp = [...items];
                for (let i = temp.length - 1; i > 0; i--) {
                    const r = Math.floor(seededRandom(seed + i + m.length) * (i + 1));
                    [temp[i], temp[r]] = [temp[r], temp[i]];
                }
                const picks = temp.slice(0, 5);
                storiesData.push({ name: m, icon: picks[0].image, images: picks });
            }
        });

        storiesData.forEach((s, idx) => {
            const el = document.createElement('div');
            el.className = 'story-item';
            el.innerHTML = `<div class="story-ring" id="ring-${idx}"><img class="story-img" src="${s.icon}"></div><div class="story-name">${memberIcons[s.name] || s.name}</div>`;
            el.onclick = () => openStory(idx);
            c.appendChild(el);
        });
    }

        const bars = document.getElementById('story-bars');
        bars.innerHTML = '';
        story.images.forEach((_, i) => {
            const bar = document.createElement('div');
            bar.className = 'story-bar';
            const fill = document.createElement('div');
            fill.className = 'story-fill';
            if (i < currentStorySlideIndex) fill.style.width = '100%';
            else if (i === currentStorySlideIndex) fill.id = 'current-fill';
            bar.appendChild(fill);
            bars.appendChild(bar);
        });
        startStoryTimer();
    }

    function startStoryTimer() {
        if(storyTimer) clearTimeout(storyTimer);
        const fill = document.getElementById('current-fill');
        if(fill) { setTimeout(() => { fill.style.transition = 'width 4s linear'; fill.style.width = '100%'; }, 10); }
        storyTimer = setTimeout(nextStory, 4000);
    }

    function nextStory() {
        const story = storiesData[currentStoryMemberIndex];
        if (currentStorySlideIndex < story.images.length - 1) {
            currentStorySlideIndex++;
            renderStorySlide();
        } else {
            if (currentStoryMemberIndex < storiesData.length - 1) {
                currentStoryMemberIndex++;
                currentStorySlideIndex = 0;
                renderStorySlide();
            } else { closeStory(); }
        }
    }

    function prevStory() {
        if (currentStorySlideIndex > 0) {
            currentStorySlideIndex--;
            renderStorySlide();
        } else if (currentStoryMemberIndex > 0) {
            currentStoryMemberIndex--;
            currentStorySlideIndex = storiesData[currentStoryMemberIndex].images.length - 1;
            renderStorySlide();
        }
    }

    function closeStory() {
        if(storyTimer) clearTimeout(storyTimer);
        document.getElementById('story-viewer').classList.remove('active');
    }

    /* ▼▼▼ 診断機能ロジック ▼▼▼ */
    function openDiagnosis() {
        document.getElementById('diag-modal').classList.add('open');
        setDiagStep(1);
        
        const grid = document.getElementById('diag-member-grid');
        grid.innerHTML = "";
        // ★修正: memberOrderを使って順番通りにボタン生成
        memberOrder.forEach(m => {
            const btn = document.createElement('button');
            btn.className = "diag-btn";
            btn.innerHTML = `<span style="font-size:1.5rem;">${memberIcons[m] || '✨'}</span><span style="font-size:0.7rem;">${m}</span>`;
            btn.onclick = () => selectDiagMember(m);
            grid.appendChild(btn);
        });
    }

    function closeDiagnosis() {
        document.getElementById('diag-modal').classList.remove('open');
    }

    function setDiagStep(step) {
        document.querySelectorAll('.diag-step').forEach(el => el.classList.remove('active'));
        document.getElementById(`diag-step-${step}`).classList.add('active');
    }

    function selectDiagMember(member) {
        diagSelectedMember = member;
        setDiagStep(2);
    }

    function selectDiagVibe(vibe) {
        diagSelectedVibe = vibe;
        setDiagStep(3);
    }

    function runDiagnosis(mood) {
        let candidates = allData.filter(d => d.member === diagSelectedMember);

        if (diagSelectedVibe !== 'all') {
            const keywords = vibeKeywords[diagSelectedVibe];
            const filtered = candidates.filter(d => 
                keywords.some(k => d._tagsArray.some(t => t.includes(k)))
            );
            if (filtered.length > 0) candidates = filtered;
        }

        if (mood === 'new') {
            candidates.sort((a,b) => b._originalIndex - a._originalIndex);
        } else if (mood === 'old') {
            candidates.sort((a,b) => a._originalIndex - b._originalIndex);
        } else {
            candidates.sort(() => Math.random() - 0.5);
        }

        if (candidates.length > 0) {
            const top5 = candidates.slice(0, 5);
            const winner = top5[Math.floor(Math.random() * top5.length)];
            
            document.getElementById('diag-res-img').src = winner.image;
            document.getElementById('diag-res-name').innerText = `${winner.member} / ${winner.cosplayer}`;
            
            document.querySelectorAll('.diag-step').forEach(el => el.classList.remove('active'));
            document.getElementById('diag-result').classList.add('active');
        } else {
            alert("条件に合う写真が見つかりませんでした…別の条件で試してみて！");
        }
    }
</script>
