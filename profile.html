<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosplayer Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f0f0f; --text: #f1f1f1; --sub: #aaaaaa; --primary: #3ea6ff; }
        body { font-family: "M PLUS Rounded 1c", sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; }
        
        /* トップの豪華なヘッダー */
        .cover { width: 100%; height: 250px; background-size: cover; background-position: center; position: relative; }
        .cover-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(to bottom, rgba(15,15,15,0.2) 0%, rgba(15,15,15,1) 100%); }
        .nav-bar { position: absolute; top: 15px; left: 15px; z-index: 10; }
        .btn-home { background: rgba(0,0,0,0.5); color: #fff; padding: 8px 15px; border-radius: 20px; text-decoration: none; font-weight: bold; border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); }
        
        .profile-container { position: relative; max-width: 1000px; margin: -60px auto 20px; padding: 0 20px; z-index: 5; }
        .avatar { width: 120px; height: 120px; border-radius: 50%; border: 4px solid var(--bg); object-fit: cover; box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: #333; }
        .name { font-size: 2rem; font-weight: 800; margin: 10px 0 5px; }
        
        .btn-sns { display: inline-flex; align-items: center; gap: 6px; color: #fff; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: bold; font-size: 0.9rem; margin: 5px 5px 5px 0; }
        .c-tw { background: #1da1f2; } .c-ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); } .c-fa { background: #e5005a; } .c-bo { background: #fc4d50; } .c-tk { background: #000; border: 1px solid #333; }
        
        .stats-bar { display: flex; gap: 20px; margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .stat { display: flex; flex-direction: column; }
        .stat-val { font-size: 1.3rem; font-weight: bold; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--sub); }

        /* 画像グリッド */
        .masonry-grid { column-count: 2; column-gap: 16px; padding: 20px; max-width: 1800px; margin: 0 auto; }
        @media (min-width: 600px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1000px) { .masonry-grid { column-count: 4; } }
        .card { break-inside: avoid; margin-bottom: 16px; position: relative; border-radius: 12px; overflow: hidden; }
        .card img { width: 100%; height: auto; display: block; border-radius: 12px; }
        .card-label { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 15px 10px 10px; font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="cover" class="cover" style="background-image: url('');">
        <div class="cover-overlay"></div>
        <div class="nav-bar"><a href="index.html" class="btn-home"><i class="fas fa-home"></i> HOME</a></div>
    </div>
    
    <div class="profile-container">
        <img id="avatar" class="avatar" src="">
        <h1 id="name" class="name">Loading...</h1>
        <div id="sns-box" style="margin-bottom: 10px;"></div>
        
        <div class="stats-bar">
            <div class="stat"><span id="stat-photos" class="stat-val">-</span><span class="stat-label">Photos</span></div>
            <div class="stat"><span id="stat-members" class="stat-val">-</span><span class="stat-label">Members</span></div>
        </div>
    </div>

    <div id="grid" class="masonry-grid"></div>

<script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgV5MvOa8ZUcpQ9jL1HhYQOLS_y78ZoOnQI96iru-5JZVTrRc5Li4hBkN7igEyB5p73EuaaEfLC38G/pub?gid=0&single=true&output=csv";
    const PROF_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgV5MvOa8ZUcpQ9jL1HhYQOLS_y78ZoOnQI96iru-5JZVTrRc5Li4hBkN7igEyB5p73EuaaEfLC38G/pub?gid=1592730885&single=true&output=csv";
    
    // URLから対象の名前を取得
    const urlParams = new URLSearchParams(window.location.search);
    const targetName = urlParams.get('name');

    if (!targetName) {
        document.body.innerHTML = '<div style="text-align:center; padding:50px;"><h2>コスプレイヤーが指定されていません</h2><a href="index.html">ホームに戻る</a></div>';
    } else {
        document.title = `${targetName} - Portfolio`;
        document.getElementById('name').innerText = targetName;
        loadData();
    }

    function loadData() {
        // プロフィール読み込み
        Papa.parse(PROF_URL, {
            download: true, header: true, skipEmptyLines: true,
            complete: function(pRes) {
                const prof = pRes.data.find(p => p.cosplayer === targetName) || {};
                
                // 画像読み込み
                Papa.parse(CSV_URL, {
                    download: true, header: true, skipEmptyLines: true,
                    complete: function(res) {
                        const myData = res.data.filter(d => (d.cosplayer || d['レイヤー']) === targetName);
                        buildUI(myData, prof);
                    }
                });
            }
        });
    }

    function buildUI(data, prof) {
        if (data.length === 0) return;
        
        // ヘッダーとアイコン設定（最新の画像を使用）
        document.getElementById('cover').style.backgroundImage = `url('${data[0].image || data[0]['画像']}')`;
        document.getElementById('avatar').src = data[0].image || data[0]['画像'];
        
        // 統計
        document.getElementById('stat-photos').innerText = data.length;
        const members = new Set(data.map(d => d.member || d['名前'])).size;
        document.getElementById('stat-members').innerText = members;

        // SNSリンク
        const snsBox = document.getElementById('sns-box');
        const getU = (key) => { const k = Object.keys(prof).find(x=>x.toLowerCase().includes(key)); return k && prof[k] ? prof[k] : null; };
        const tw = getU('twitter') || getU('x');
        const ig = getU('insta');
        const fa = getU('fantia');
        const bo = getU('booth');
        const tk = getU('tiktok');

        if(tw) snsBox.innerHTML += `<a href="${tw}" target="_blank" class="btn-sns c-tw"><i class="fab fa-x-twitter"></i> X(Twitter)</a>`;
        if(ig) snsBox.innerHTML += `<a href="${ig}" target="_blank" class="btn-sns c-ig"><i class="fab fa-instagram"></i> Instagram</a>`;
        if(fa) snsBox.innerHTML += `<a href="${fa}" target="_blank" class="btn-sns c-fa"><i class="fas fa-heart"></i> Fantia</a>`;
        if(bo) snsBox.innerHTML += `<a href="${bo}" target="_blank" class="btn-sns c-bo"><i class="fas fa-store"></i> Booth</a>`;
        if(tk) snsBox.innerHTML += `<a href="${tk}" target="_blank" class="btn-sns c-tk"><i class="fab fa-tiktok"></i> TikTok</a>`;

        // グリッド描画
        const grid = document.getElementById('grid');
        data.forEach(d => {
            const img = d.image || d['画像'];
            const mem = d.member || d['名前'];
            grid.innerHTML += `
                <div class="card">
                    <img src="${img}" loading="lazy">
                    <div class="card-label">${mem}</div>
                </div>`;
        });
    }
</script>
</body>
</html>
