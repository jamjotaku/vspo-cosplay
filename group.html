<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大型併せアーカイブ | ぶいすぽっ！</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- 基本設定 --- */
        :root {
            --primary: #5c6ac4;
            --bg: #f4f6f8;
            --text: #333;
            --card-bg: #fff;
            --accent: #ff9f43;
        }
        body {
            font-family: "M PLUS Rounded 1c", sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 10px;
        }

        /* --- ヘッダー周り --- */
        header { text-align: center; margin: 20px 0 30px; }
        h1 { font-size: 1.5rem; color: var(--primary); margin: 10px 0; }
        
        .nav-btn {
            display: inline-block;
            padding: 8px 16px;
            background: #fff;
            color: #666;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        /* 検索・タグエリア */
        .search-area { max-width: 800px; margin: 0 auto; padding: 0 10px; }
        #searchInput {
            width: 100%; max-width: 400px;
            padding: 12px; border-radius: 25px;
            border: 2px solid #ddd; outline: none;
            font-size: 1rem; margin-bottom: 15px;
        }

        .tag-cloud { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .tag-chip {
            background: #fff; color: var(--primary);
            padding: 6px 12px; border-radius: 15px;
            font-size: 0.85rem; cursor: pointer;
            border: 1px solid var(--primary); transition: 0.2s;
        }
        .tag-chip:hover, .tag-chip.active { background: var(--primary); color: #fff; }

        /* --- ✨ Pinterest風 Masonryレイアウト ✨ --- */
        .masonry {
            column-count: 5; /* PC大画面なら5列 */
            column-gap: 15px;
            max-width: 1600px;
            margin: 20px auto;
        }
        @media (max-width: 1200px) { .masonry { column-count: 4; } }
        @media (max-width: 900px)  { .masonry { column-count: 3; } }
        @media (max-width: 600px)  { .masonry { column-count: 2; column-gap: 10px; } }

        /* --- カードデザイン --- */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 15px; /* 下のカードとの隙間 */
            break-inside: avoid; /* 列の途中でカードが千切れないようにする */
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            position: relative;
            display: inline-block; /* 表示崩れ防止 */
            width: 100%;
        }
        .card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }

        .card img {
            width: 100%;
            height: auto; /* ★重要：高さを自動にして比率を保つ */
            display: block;
            cursor: pointer;
        }

        .card-content { padding: 10px; }
        
        .event-badge {
            background: var(--accent); color: #fff;
            font-size: 0.75rem; padding: 3px 8px; border-radius: 4px;
            display: inline-block; margin-bottom: 6px; font-weight: bold;
        }
        .member-text { font-weight: bold; font-size: 0.95rem; line-height: 1.4; color: #333; }
        .layer-text { font-size: 0.8rem; color: #888; margin-top: 3px; display: block; }

        .tw-link {
            position: absolute; top: 8px; right: 8px;
            background: rgba(0,0,0,0.6); color: #fff;
            width: 30px; height: 30px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            text-decoration: none; backdrop-filter: blur(2px);
            opacity: 0.8;
        }
        .tw-link:hover { opacity: 1; background: #1da1f2; }

        /* --- モーダル --- */
        .modal {
            display: none; position: fixed; z-index: 999;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            justify-content: center; align-items: center;
            padding: 10px;
        }
        .modal.open { display: flex; }
        .modal img {
            max-width: 100%; max-height: 95vh;
            border-radius: 4px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            object-fit: contain;
        }
        .close-modal {
            position: absolute; top: 20px; right: 20px;
            color: white; font-size: 30px; cursor: pointer;
            text-shadow: 0 0 5px #000;
        }
        
        #loading { text-align: center; margin-top: 50px; color: #666; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="nav-btn"><i class="fas fa-arrow-left"></i> トップに戻る</a>
    <h1>🎪 大型併せアーカイブ</h1>

    <div class="search-area">
        <input type="text" id="searchInput" placeholder="メンバー名やイベント名で検索..." oninput="filterData()">
        <div class="tag-cloud" id="tagCloud"></div>
    </div>
</header>

<div id="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</div>

<div class="masonry" id="grid"></div>

<div id="modal" class="modal" onclick="document.getElementById('modal').classList.remove('open')">
    <span class="close-modal">&times;</span>
    <img id="modalImg" src="" onclick="event.stopPropagation()">
</div>

<script>
    /* ▼ GASのURLをここに貼り付けてください ▼ */
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwVOXeAag8jo_slfZDSwAYxPw549qRZkYNpEB3hn6XM4iDSAK63Ip7CraDE7Q--hWE_/exec"; 

    let allData = [];

    window.onload = async function() {
        try {
            const res = await fetch(GAS_API_URL + "?mode=group");
            allData = await res.json();
            document.getElementById('loading').style.display = 'none';
            
            // 新しい順に並び替え（スプレッドシートの下の行＝最新とする場合）
            allData.reverse(); 

            generateTags(allData);
            render(allData);
        } catch(e) {
            document.getElementById('loading').innerText = "エラーが発生しました";
            console.error(e);
        }
    };

    function render(data) {
        const grid = document.getElementById('grid');
        grid.innerHTML = "";
        
        if(data.length === 0) {
            grid.innerHTML = "<p style='text-align:center; width:100%; margin-top:20px;'>見つかりませんでした</p>";
            return;
        }

        data.forEach(item => {
            // item.members = "メンバー / レイヤー"
            const parts = item.members.split(" / ");
            const mem = parts[0] || "";
            const lay = parts[1] ? `@${parts[1]}` : "";

            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <img src="${item.image}" loading="lazy" onclick="openModal('${item.image}')">
                ${item.link ? `<a href="${item.link}" target="_blank" class="tw-link"><i class="fab fa-twitter"></i></a>` : ''}
                <div class="card-content">
                    <span class="event-badge">${item.title}</span>
                    <div class="member-text">${mem}</div>
                    ${lay ? `<span class="layer-text">${lay}</span>` : ''}
                </div>
            `;
            grid.appendChild(div);
        });
    }

    function generateTags(data) {
        const counts = {};
        data.forEach(d => { if(d.title) counts[d.title] = (counts[d.title]||0)+1; });
        
        const container = document.getElementById('tagCloud');
        container.innerHTML = `<span class="tag-chip active" onclick="filterByTag('ALL', this)">全て</span>`;
        
        Object.keys(counts).forEach(tag => {
            const btn = document.createElement('span');
            btn.className = 'tag-chip';
            btn.innerText = `${tag} (${counts[tag]})`;
            btn.onclick = function() { filterByTag(tag, this); };
            container.appendChild(btn);
        });
    }

    function filterByTag(tag, el) {
        document.querySelectorAll('.tag-chip').forEach(e => e.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('searchInput').value = "";
        
        if(tag === 'ALL') render(allData);
        else render(allData.filter(d => d.title === tag));
    }

    function filterData() {
        document.querySelectorAll('.tag-chip').forEach(e => e.classList.remove('active'));
        const val = document.getElementById('searchInput').value.toLowerCase();
        render(allData.filter(d => (d.title+d.members).toLowerCase().includes(val)));
    }

    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('modal').classList.add('open');
    }
</script>

</body>
</html>
